services:
  - type: web
    name: garmin-mcp
    runtime: python
    plan: starter          # free tier sleeps after 15 min idle; cold start will
                           # time out Claude's first call. starter stays warm.
    region: singapore      # closest to you; also oregon, frankfurt, ohio, virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GARMIN_TOKENS
        sync: false        # set manually in the dashboard, never in git
      - key: MCP_KEY
        generateValue: true
      - key: MAX_LIST_ITEMS
        value: "50"
